name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Setup
        env:
          CI: false
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build -- --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          Write-Host "Checking dist folder..."
          Get-ChildItem -Path dist -File

          $installer = Get-ChildItem -Path dist -Filter *.exe -File

          if (-not $installer) {
            Write-Error "No Windows .exe installer was created."
            exit 1
          }

          Write-Host "SUCCESS: $($installer.Name)"

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Kisti-Manager-Windows-Setup
          path: dist/*.exe
          if-no-files-found: error
